[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dtm_voxelization"
version = "0.2.0"
description = "Refined, terrain-carved hex grids of a DTM, split along fracture surfaces and exported for SPEED."
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "Alessio Fumagalli" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "meshio",
]

[project.optional-dependencies]
# surface = "poisson" in a case; Open3D ships wheels up to Python 3.12
poisson = ["open3d-cpu"]

[project.urls]
Repository = "https://github.com/compgeo-mox/dtm_voxelization"

[project.scripts]
dtm-voxelization = "dtm_voxelization.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dtm_voxelization = ["template_data.npz"]
