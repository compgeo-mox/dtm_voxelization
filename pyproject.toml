[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dtm_voxelization"
version = "0.1.0"
description = "Voxelize a real DTM (digital terrain model) into a carved PorePy Cartesian grid."
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "Alessio Fumagalli" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "porepy",
    "meshio",
]

[project.urls]
Repository = "https://github.com/compgeo-mox/dtm_voxelization"

[project.scripts]
dtm-voxelization = "dtm_voxelization.build_cartgrid_carved:main"
dtm-voxelization-refined = "dtm_voxelization.build_cartgrid_carved_refined:main"
dtm-export-planes = "dtm_voxelization.export_planes_stl:main"
dtm-align-surface = "dtm_voxelization.align_surface:main"
dtm-cut-surface = "dtm_voxelization.cut_surface:main"
dtm-detach-cells = "dtm_voxelization.detach_cells:main"
dtm-export-speed = "dtm_voxelization.export_speed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dtm_voxelization = ["template_data.npz"]
