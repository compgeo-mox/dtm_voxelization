# Rialba. Relative paths are resolved against this file's folder.

name = "rialba"                  # also names the SPEED mesh: speed/rialba.mesh
output = "../output/rialba"

[dtm]
points = "../data/xyz/merged.xyz"   # point cloud, X Y Z columns, 2-line header
surface = "height_field"            # the terrain is z = f(x, y): linear interpolation of the points
trim_to_footprint = false           # the points cover the whole rectangle

[grid]
target_cells = 100_000           # carved cells to aim for (accepted within +-30%)
z_padding = 50.0                 # domain below the lowest and above the highest DTM point
# level-2 rectangles [xmin, xmax, ymin, ymax]. Each takes its own z range from
# the terrain over its own rectangle. Rectangles may INTERSECT: ones closer
# than 3 level-1-child cells (one coarse cell, i.e. `cell_edge` metres, which
# the run picks to meet target_cells) are merged into a single refinement call
# over the union of their footprints, as deep as the deepest of them -- the log
# says when it happens. Ones further apart than that keep their own depth.
# Where the union's outline steps, it must step by at least 2 cells: a
# reentrant corner with a run of only one cell past it has no transition
# template, and the build refuses it.
inner_regions = [
    # one rectangle over the towers, the fracture (x [-192,-123], y [227,267])
    # and the source points (x [-286,-242], y [-79,-39]), so the fine mesh runs
    # unbroken between them and its outline has no reentrant corner at all
    [-310.0, -10.0, -103.0, 425.0],
]
region_z_padding = 20.0          # clearance above and below the terrain inside each
outer_scale = 1.5                # level-1 region: the inner one scaled in x, y and z,
                                 # never less than 1.5 coarse cells wider in x and y
validate_mesh = true            # exhaustive conformity checks, slow on large grids

# merged.xyz is the UTM32N DTM minus its mean (527837.392605, 5082191.470488,
# 474.976610), z included: the STL's x/y already carry that shift, its z does not
[[surfaces]]
name = "frattura_verticale"
stl = "../data/surfaces/frattura_verticale_shifted.stl"
translation = [0.0, 0.0, -474.976610]

# a polygon given directly in the DTM's frame, corners in order:
# [[surfaces]]
# name = "piano_1"
# corners = [[x1, y1, z1], [x2, y2, z2], [x3, y3, z3], [x4, y4, z4]]
